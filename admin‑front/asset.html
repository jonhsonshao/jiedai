<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人资产面板</title>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.0/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#050512;color:#fff;padding:24px}
.card{max-width:800px;margin:0 auto;background:#101428;padding:24px;border-radius:12px;margin-bottom:16px}
.back{color:#00b8ff;cursor:pointer;margin-bottom:12px}
.item{padding:10px 0;border-bottom:1px solid #293056}
.title{color:#00b8ff;font-size:18px;margin-bottom:12px}
.operate a{display:inline-block;margin:8px 10px 0 0;background:#924cff;padding:10px 16px;border-radius:8px;color:#fff;text-decoration:none}
input{width:100%;padding:12px;background:#1b2240;border:1px solid #293056;color:#fff;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="card">
    <div class="back" onclick="history.back()">← 返回首页</div>
    <div class="title">查询个人资产</div>
    <input id="walletInput" placeholder="输入你的钱包地址">
    <button onclick="loadAsset()" style="padding:10px 20px;background:#00b8ff;border:none;border-radius:8px;color:#000">查询资产</button>
    <div id="assetBox" style="margin-top:20px;"></div>
</div>

<script>
const API_PREFIX="/api";
async function loadAsset(){
    const wallet = document.getElementById("walletInput").value.trim();
    if(!wallet){alert("请输入钱包地址");return;}
    const res = await axios.get(`${API_PREFIX}/asset/get?wallet=${wallet}`);
    const data = res.data.data.user;
    let html = `
    <div class="item">是否持有神王一号权益：${data.pool1Flag===1?"✅已获得":"❌无"}</div>
    <div class="item">锁仓代币（到期可提现）：${data.lockToken}</div>
    <div class="item">自由可兑换代币：${data.freeToken}</div>
    <div class="item">排行榜奖励代币：${data.rankRewardToken}</div>
    <div class="item">推荐二号池人数：${data.refPool2Count}</div>
    <div class="item">推荐三号池人数：${data.refPool3Count}</div>
    <div class="item">总有效推荐：${data.refTotalCount}</div>
    <div class="operate" style="margin-top:16px">
        <a href="exchange.html?wallet=${wallet}">自由代币兑换USDT</a>
        <a href="withdraw.html?wallet=${wallet}">锁仓代币提现申请</a>
    </div>
    `;
    document.getElementById("assetBox").innerHTML = html;
}
</script>
</body>
</html>
