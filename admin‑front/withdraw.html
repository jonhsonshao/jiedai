<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锁仓代币提现申请</title>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.0/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#050512;color:#fff;padding:24px}
.card{max-width:600px;margin:0 auto;background:#101428;padding:24px;border-radius:12px}
.back{color:#00b8ff;cursor:pointer;margin-bottom:12px}
input{width:100%;padding:12px;background:#1b2240;border:1px solid #293056;color:#fff;border-radius:8px;margin:10px 0}
button{padding:12px 20px;background:#924cff;color:#fff;border:none;border-radius:8px;width:100%}
.tip{color:#00b8ff;font-size:14px;margin:10px 0}
</style>
</head>
<body>
<div class="card">
    <div class="back" onclick="history.back()">← 返回资产页</div>
    <h3>锁仓代币提现申请</h3>
    <p class="tip">募集全部完成后统一链上发放代币至BSC钱包</p>
    <input id="wallet" placeholder="钱包地址">
    <input id="withdrawAmount" placeholder="申请提取锁仓代币数量">
    <button onclick="submitWithdraw()">提交提现申请</button>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
document.getElementById("wallet").value = urlParams.get("wallet")||"";
async function submitWithdraw(){
    const wallet = document.getElementById("wallet").value.trim();
    const withdrawToken = Number(document.getElementById("withdrawAmount").value);
    const res = await axios.post("/api/withdraw/apply",{wallet,withdrawToken});
    alert(res.data.msg);
    location.href="asset.html";
}
</script>
</body>
</html>
