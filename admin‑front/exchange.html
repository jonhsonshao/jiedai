<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代币兑换USDT</title>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.0/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#050512;color:#fff;padding:24px}
.card{max-width:600px;margin:0 auto;background:#101428;padding:24px;border-radius:12px}
.back{color:#00b8ff;cursor:pointer;margin-bottom:12px}
input{width:100%;padding:12px;background:#1b2240;border:1px solid #293056;color:#fff;border-radius:8px;margin:10px 0}
button{padding:12px 20px;background:#00b8ff;color:#000;border:none;border-radius:8px;width:100%}
.tip{color:#ffbb44;font-size:14px;margin:10px 0}
</style>
</head>
<body>
<div class="card">
    <div class="back" onclick="history.back()">← 返回资产页</div>
    <h3>自由代币兑换 USDT（1000代币 = 1 USDT）</h3>
    <p class="tip">⚠️兑换后的份额后期上链不再发放代币</p>
    <input id="wallet" placeholder="钱包地址">
    <input id="tokenNum" placeholder="输入要卖出的自由代币数量">
    <div id="calcTip"></div>
    <button onclick="submitExchange()">提交兑换</button>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
document.getElementById("wallet").value = urlParams.get("wallet")||"";
document.getElementById("tokenNum").oninput = function(){
    const val = Number(this.value);
    if(val>0){
        document.getElementById("calcTip").innerText = `预计兑换：${val/1000} USDT`;
    }
}
async function submitExchange(){
    const wallet = document.getElementById("wallet").value.trim();
    const payToken = Number(document.getElementById("tokenNum").value);
    const res = await axios.post("/api/exchange/create",{wallet,payToken});
    alert(res.data.msg);
    location.href="asset.html";
}
</script>
</body>
</html>
